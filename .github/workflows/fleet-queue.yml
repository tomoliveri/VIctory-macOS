# Mac test fleet: leases tasks and findings through issue comments, checks
# results, files findings and screens text in fleet issues. See
# docs/fleet.md. Runs only for issues labelled fleet:task or fleet:finding,
# or for every issue when the repository variable FLEET_MODERATE_ALL is
# "true". Comment text is never evaluated. There is no concurrency group,
# because GitHub would drop queued events: queue.sh resolves races itself.
name: Fleet queue

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write

jobs:
  queue:
    if: >-
      github.event.issue.pull_request == null &&
      (contains(github.event.issue.labels.*.name, 'fleet:task') ||
       contains(github.event.issue.labels.*.name, 'fleet:finding') ||
       vars.FLEET_MODERATE_ALL == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/fleet
          persist-credentials: false
      - run: tools/fleet/queue.sh event
        env:
          GH_TOKEN: ${{ github.token }}
